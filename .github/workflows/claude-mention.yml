name: Claude trả lời @claude

# App "Claude" da cai san tren repo, nhung app CHI cap quyen -- thu thuc su
# chay Claude Code la workflow nay. Thieu no thi tag @claude khong ai tra loi
# (da kiem chung o issue #2: tag xong doi 5 phut, khong phan hoi, khong run).
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:
  tra-loi:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra đã có khoá chưa
        id: guard
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "co_khoa=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chua dat ANTHROPIC_API_KEY trong repo secrets -> bo qua."
          else
            echo "co_khoa=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.co_khoa == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--max-turns 20"
